{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('voir_formation', theme_id=formation.theme_id) }}"
   class="btn btn-sm btn-outline-secondary mb-3">
  <i class="bi bi-arrow-left"></i> Retour
</a>

<div class="card shadow-sm border-0">
  <div class="card-header text-white" style="background: {{ formation.theme.couleur }};">
    <h4 class="mb-0">
      <i class="bi {{ formation.theme.icone }}"></i>
      {{ formation.titre }}
    </h4>
  </div>
  <div class="card-body p-4 formation-content">
    {{ formation.contenu | safe }}
  </div>
</div>

<div class="text-center my-4">
  <a href="{{ url_for('voir_formation', theme_id=formation.theme_id) }}"
     class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left"></i> Retour
  </a>
</div>
{% endblock %}
