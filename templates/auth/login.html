{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-lg border-0" style="border-radius: 20px;">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <i class="bi bi-stars" style="font-size: 3rem; color: #7b1fa2;"></i>
          <h3 class="mt-2">Voyance Academy</h3>
          <p class="text-muted">Plateforme de formation</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Nom d'utilisateur</label>
            <input type="text" name="username" class="form-control form-control-lg" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control form-control-lg" required>
          </div>
          <button class="btn btn-lg w-100 text-white" style="background: linear-gradient(135deg, #4a148c, #7b1fa2);">
            Se connecter
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
